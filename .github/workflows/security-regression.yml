name: Security Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hina_test
          POSTGRES_USER: hina
          POSTGRES_PASSWORD: hina_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hina -d hina_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -fsS http://localhost:6333/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password-strong
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password-strong 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://hina:hina_test_password@localhost:5432/hina_test
      ENVIRONMENT: testing
      JWT_SECRET: test-only-secret-for-hina-security-ci-only
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: test-password-strong
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q orchestrator tests
      - name: Verify migration head
        run: alembic upgrade head && alembic current
      - name: Run test suite including PostgreSQL integration
        run: pytest -q
